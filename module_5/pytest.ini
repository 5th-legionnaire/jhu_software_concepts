[pytest]
# Run from module_5/:  pytest
# Every collected test runs; there is no marker selection. conftest.py rejects
# any test that carries none of the markers below, and --strict-markers rejects
# a misspelled one, so a test can neither go unmarked nor silently never run.
# Coverage is scoped to src/ relative to this file, so invoke from module_5/.
addopts = -q --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=100
testpaths = tests
markers =
    web: Flask route/page tests
    buttons: "Pull Data" and "Update Analysis" behavior
    analysis: formatting/rounding of analysis output
    db: database schema/inserts/selects
    integration: end-to-end flows
    security: SQL safety, least privilege, and repository policy checks
