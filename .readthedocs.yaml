version: 2

build:
  os: ubuntu-24.04
  tools:
    # Read the Docs offers major.minor only, so this is 3.14.x rather than the
    # exact 3.14.6 that local development and CI pin.
    python: "3.14"

sphinx:
  configuration: module_4/docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: module_4/requirements.txt
