[pytest]
# Run from module_4/:  pytest -m "web or buttons or analysis or db or integration"
# Coverage is scoped to src/ (the application code the rubric names). Paths are
# relative to this file's directory, so pytest must be invoked from module_4/.
addopts = -q --cov=src --cov-report=term-missing --cov-fail-under=100
testpaths = tests
markers =
    web: Flask route/page tests
    buttons: "Pull Data" and "Update Analysis" behavior
    analysis: formatting/rounding of analysis output
    db: database schema/inserts/selects
    integration: end-to-end flows
